---
version: "2.0"

services:
  web:
    image: ghcr.io/akash-network/hello-akash-world@sha256:2872578146c16a510f182e62bc1132ec38af4f70a38841c4642e76ae75da5bb1
    expose:
      - port: 3000
        as: 80
        to:
          - global: true

profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 512Mi
  placement:
    dcloud:
      pricing:
        web:
          denom: uact
          amount: 10000

deployment:
  web:
    dcloud:
      profile: web
      count: 1
