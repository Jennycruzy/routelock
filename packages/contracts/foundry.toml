[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# pnpm links dependencies out of the workspace root store, so the compiler has to
# be allowed to read through those symlinks.
allow_paths = ["../../node_modules"]
# Deploy.s.sol writes one address file per chain. Nothing else is writable.
fs_permissions = [{access = "read-write", path = "../../deployments"}]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
